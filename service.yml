name: php-httpd
title: Apache HTTP server (PHP)
type: service
from: httpd
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.6"

labels:
- httpd
- php

links:
- name: backend
  title: Backend
  env:
  - name: APACHE_BACKEND_HOST
    value: '{{link.host}}'
  - name: APACHE_BACKEND_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - php-fpm

build:
  link: backend
  dockerfile: Dockerfile

settings:
- name: docroot
  title: HTTPd docroot
  var: DOCROOT_SUBDIR

env:
- name: APACHE_DOCUMENT_ROOT
  value: /var/www/html/$(DOCROOT_SUBDIR)

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: apache
    env:
    - name: APACHE_VHOST_PRESET
      value: php
